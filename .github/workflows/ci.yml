name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uvx ruff check --select E4,E7,E9,F .
      - name: Test
        run: uv run pytest -q
